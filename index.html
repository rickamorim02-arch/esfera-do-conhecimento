<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Esfera do Conhecimento</title><meta name="theme-color" content="#07111e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>body{margin:0;background:#07111e;color:#e8f6ff;font:14px system-ui}header{padding:12px;background:#0d2031;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}button,input,textarea{border:1px solid #34586c;background:#132d42;color:white;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}#scene{height:53vh;touch-action:none;display:block;width:100%}.panel{padding:12px;display:grid;gap:8px}textarea{width:100%;box-sizing:border-box;min-height:75px}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{background:#10273b;border-radius:9px;padding:10px;margin:5px 0}.muted{color:#a8c4d2;font-size:12px}#info{min-height:30px}.tag{display:inline-block;border:1px solid #416579;border-radius:20px;padding:4px 8px;margin:3px}canvas{display:block}</style></head><body><header><h1>◉ Esfera do Conhecimento</h1><button id="export">Exportar backup</button></header><canvas id="scene"></canvas><section class="panel"><div class="muted">Arraste para girar • toque em uma esfera para entrar • pinça para ampliar • botão Voltar para sair</div><div class="actions"><button id="back">↩ Voltar</button><button id="story">▶ História</button><button id="importbtn">Importar backup</button><input type="file" id="import" accept=".json" hidden></div><div id="info"></div><textarea id="content" placeholder="Envie uma informação: um fato, ideia, acontecimento ou conceito..."></textarea><div class="actions"><button id="attach">Anexar documento</button><input type="file" id="documents" accept=".txt,.md,.csv,.json,.pdf,.docx" multiple hidden><span id="attachstatus" class="muted" role="status"></span></div><div class="actions"><button id="add">Adicionar à esfera</button><button id="reset">Reorganizar</button></div><div id="list"></div></section><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const KEY='esfera_conhecimento_v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};let active=null, angle=0,zoom=13,drag=false,startX=0,startY=0,moved=false;
const stop=new Set('a o e de da do das dos um uma que com para por em no na os as ao se ou é são foi ser como mais menos sobre entre sua seu seus suas esta este isso essa esse quando onde muito também'.split(' '));
function words(s){return [...new Set((s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9]{3,}/g)||[]).filter(w=>!stop.has(w)))];}
function similarity(a,b){let A=new Set(words(a)),B=new Set(words(b));let n=[...A].filter(x=>B.has(x)).length;return n/Math.max(1,Math.min(A.size,B.size));}
function groups(){let parent=data.map((_,i)=>i);function root(i){while(parent[i]!==i)i=parent[i]=parent[parent[i]];return i}for(let i=0;i<data.length;i++)for(let j=0;j<i;j++)if(similarity(data[i].text,data[j].text)>=.34)parent[root(i)]=root(j);let m=new Map();data.forEach((d,i)=>{let r=root(i);if(!m.has(r))m.set(r,[]);m.get(r).push(d)});return [...m.values()].sort((a,b)=>b.length-a.length)}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111e);const camera=new THREE.PerspectiveCamera(55,1,.1,1000);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#scene'),antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const root=new THREE.Group();scene.add(root);scene.add(new THREE.AmbientLight(0xffffff,1.3));let spheres=[];const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function clear(){while(root.children.length){let c=root.children[0];root.remove(c);c.geometry?.dispose();c.material?.dispose()}spheres=[]}
function ball(x,y,z,r,color,meta){let geo=new THREE.SphereGeometry(r,28,20),mat=new THREE.MeshPhongMaterial({color,transparent:true,opacity:.35,shininess:95,side:THREE.DoubleSide});let mesh=new THREE.Mesh(geo,mat);mesh.position.set(x,y,z);root.add(mesh);let wire=new THREE.Mesh(new THREE.SphereGeometry(r*1.012,16,12),new THREE.MeshBasicMaterial({color,wireframe:true,transparent:true,opacity:.24}));wire.position.copy(mesh.position);root.add(wire);mesh.userData=meta;spheres.push(mesh);return mesh}
function render(){clear();let gg=groups();if(active===null){ball(0,0,0,4.3,0x0f7898,{type:'root'});gg.forEach((g,i)=>{let n=gg.length,phi=Math.acos(1-2*(i+.5)/n),theta=Math.PI*(1+Math.sqrt(5))*i;let r=2.9,sz=Math.min(.9,.36+.13*Math.sqrt(g.length));ball(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta),sz,0x24d5c4,{type:'group',index:i})})}else{let g=gg[active];if(!g){active=null;return render()}ball(0,0,0,3.8,0x0e7897,{type:'groupcore'});g.forEach((d,i)=>{let n=g.length,phi=Math.acos(1-2*(i+.5)/n),theta=Math.PI*(1+Math.sqrt(5))*i;ball(2.5*Math.sin(phi)*Math.cos(theta),2.5*Math.cos(phi),2.5*Math.sin(phi)*Math.sin(theta),.28,0xffbd63,{type:'item',id:d.id})})}updateInfo()}
function updateInfo(){let gg=groups(),g=active===null?null:gg[active];document.querySelector('#info').innerHTML=active===null?`<b>Universo principal</b> · ${data.length} informações · ${gg.length} esferas<br><span class="muted">Esferas são fundidas por sobreposição de palavras relevantes. Backup JSON inclui textos, mas não os arquivos originais. Esta é uma aproximação local, não uma análise semântica por IA.</span>`:`<b>Esfera ${active+1}</b> · ${g?.length||0} informações`;document.querySelector('#list').innerHTML=(g||gg.map((a,i)=>({text:`Esfera ${i+1} · ${a.length} informações`,id:'g'+i}))).map(d=>`<div class="item" data-id="${d.id}">${d.documentName?`<div class="muted">📎 ${escapeHTML(d.documentName)} · trecho ${d.part}/${d.totalParts} <button data-download="${d.documentId}">Baixar original</button></div>`:""}${escapeHTML(d.text)}${d.date?`<div class="muted">${new Date(d.date).toLocaleString('pt-BR')}</div>`:''}</div>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{if(active===null){active=Number(el.dataset.id.slice(1));render()}else{let d=data.find(x=>x.id===el.dataset.id);if(d)alert(d.text)}})}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()};function animate(){requestAnimationFrame(animate);root.rotation.y=angle;camera.position.set(0,0,zoom);camera.lookAt(0,0,0);renderer.render(scene,camera)}
function resize(){let c=document.querySelector('#scene');renderer.setSize(c.clientWidth,c.clientHeight,false);camera.aspect=c.clientWidth/c.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();render();animate();
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=e.clientX;startY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){let dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;angle+=dx*.008;startX=e.clientX}});canvas.addEventListener('pointerup',e=>{drag=false;if(moved)return;let rect=canvas.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);let hit=ray.intersectObjects(spheres)[0];if(hit){let m=hit.object.userData;if(m.type==='group'){active=m.index;render()}else if(m.type==='item'){let d=data.find(x=>x.id===m.id);if(d)alert(d.text)}}});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(7,Math.min(25,zoom+e.deltaY*.015))},{passive:false});let pinch=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch!==null)zoom=Math.max(7,Math.min(25,zoom+(pinch-d)*.025));pinch=d}},{passive:true});canvas.addEventListener('touchend',()=>pinch=null);

const DBNAME='esfera_documentos_v2';
function openDocs(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeDoc(id,file){let db=await openDocs();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,name:file.name,type:file.type,blob:file});tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function readDoc(id){let db=await openDocs();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readonly'),r=tx.objectStore('files').get(id);r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();reject(r.error)}})}
async function extractDoc(file){
 let ext=file.name.split('.').pop().toLowerCase();
 if(['txt','md','csv','json'].includes(ext))return await file.text();
 if(ext==='docx'){let mammoth=await import('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/+esm');return (await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}
 if(ext==='pdf'){let pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';let pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let parts=[];for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i);let txt=await page.getTextContent();parts.push(txt.items.map(x=>x.str||'').join(' '))}return parts.join('\n')}
 throw Error('Formato não suportado.');
}
document.querySelector('#attach').onclick=()=>document.querySelector('#documents').click();
document.querySelector('#documents').onchange=async e=>{
 let files=[...e.target.files],status=document.querySelector('#attachstatus'),done=0,errors=[];
 for(let file of files){
  status.textContent='Processando '+file.name+'...';
  try{
   if(file.size>20*1024*1024)throw Error('Limite de 20 MB por arquivo');
   let text=(await extractDoc(file)).trim();
   if(!text)throw Error('Sem texto selecionável; PDF digitalizado requer OCR');
   let id=crypto.randomUUID();await storeDoc(id,file);
   let chunks=text.match(/[\s\S]{1,3500}/g)||[];
   for(let i=0;i<chunks.length;i++)data.push({id:crypto.randomUUID(),text:chunks[i],date:new Date().toISOString(),documentId:id,documentName:file.name,part:i+1,totalParts:chunks.length});
   done++;
  }catch(err){errors.push(file.name+': '+err.message)}
 }
 active=null;
 try{save()}catch(err){errors.push('Limite de armazenamento de textos: '+err.message)}
 status.textContent=done+' documento(s) anexado(s). '+errors.join(' | ');
 e.target.value='';
};
document.querySelector('#list').addEventListener('click',async e=>{
 let btn=e.target.closest('[data-download]');if(!btn)return;e.stopPropagation();
 let doc=await readDoc(btn.dataset.download);if(!doc)return alert('Original indisponível neste navegador.');
 let url=URL.createObjectURL(doc.blob),a=document.createElement('a');a.href=url;a.download=doc.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
},true);

document.querySelector('#add').onclick=()=>{let el=document.querySelector('#content'),text=el.value.trim();if(!text)return alert('Digite uma informação.');data.push({id:crypto.randomUUID(),text,date:new Date().toISOString()});el.value='';active=null;save()};document.querySelector('#reset').onclick=()=>{active=null;render()};document.querySelector('#back').onclick=()=>{active=null;render()};document.querySelector('#story').onclick=()=>{let gg=groups(),items=active===null?data:gg[active]||[];if(!items.length)return alert('Adicione informações primeiro.');let sorted=[...items].sort((a,b)=>a.date.localeCompare(b.date));alert('HISTÓRIA (ordem de entrada; ainda não é ordem causal):\n\nCOMEÇO\n'+sorted[0].text+'\n\nMEIO\n'+sorted.slice(1,-1).map(d=>d.text).join('\n')+'\n\nFIM\n'+(sorted.length>1?sorted.at(-1).text:'Ainda não há informações suficientes para um fim.'))};document.querySelector('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,data},null,2)],{type:'application/json'}));a.href=u;a.download='esfera-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.querySelector('#importbtn').onclick=()=>document.querySelector('#import').click();document.querySelector('#import').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.data)||!obj.data.every(d=>typeof d.text==='string'))throw Error();if(!confirm('Substituir informações locais pelas do backup?'))return;data=obj.data;active=null;save()}catch{alert('Backup inválido.')}};
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}</script></body></html>
